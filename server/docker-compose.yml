version: '3.8'

services:
  # ── 同步服务器 ──
  sync-server:
    image: ghcr.io/nanawwa/zlplayer:master
    # 如需本地构建，注释掉 image 行，取消注释 build 段：
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: zlplay-sync-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - WS_PORT=8080
      - MAX_ROOMS=200
      - ROOM_TIMEOUT=300
      - LOG_LEVEL=info
      - HEARTBEAT_INTERVAL=30000
      - HEARTBEAT_TIMEOUT=60000
      - RATE_LIMIT=10
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Nginx 反向代理 ──
  nginx:
    image: nginx:1.25-alpine
    container_name: zlplay-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      # - "443:443"  # SSL 端口，配置证书后取消注释
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # - ./ssl:/etc/ssl:ro  # SSL 证书目录
      # - ../web/dist:/usr/share/nginx/html:ro  # Web 构建产物
    depends_on:
      sync-server:
        condition: service_healthy
